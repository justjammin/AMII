[package]
name = "amii-api"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["giphy"]

[dependencies]
giphy = { path = "giphy" }
axum = "0.8"
bytes = "1.12.1"
moka = { version = "0.12.16", features = ["future", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
