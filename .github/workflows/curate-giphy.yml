# Optional, manual: runs the Claude curator agent (agent/) for a deeper, agentic pass on specific
# characters and opens a PR that bakes the results into the API image. The hosted API's built-in
# curator (api/src/curator.rs) already grabs and categorizes new GIFs on its own schedule.
#
# Needs: secrets ANTHROPIC_API_KEY and GIPHY_API_KEY. This is the only place the GIPHY key is used;
# the deployed API just serves the reviewed manifest. Optional variable AMII_API_URL picks where the
# character list comes from (default: the upstream AMII API).
name: Curate GIPHY character manifest

on:
  workflow_dispatch:
    inputs:
      characters:
        description: Comma-separated character names or ids (blank = the ones with the fewest GIFs)
        required: false
      limit:
        description: How many characters when none are named
        default: "10"
      target:
        description: New GIFs to aim for per character
        default: "12"

permissions:
  contents: write
  pull-requests: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      AMII_API_URL: ${{ vars.AMII_API_URL || 'https://amii.api.unthrottled.io/public/' }}
    steps:
      - name: Skip when not configured
        if: env.ANTHROPIC_API_KEY == '' || env.GIPHY_API_KEY == ''
        run: echo "::notice::Set secrets ANTHROPIC_API_KEY and GIPHY_API_KEY to run the curator."
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != '' && env.GIPHY_API_KEY != ''
      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != '' && env.GIPHY_API_KEY != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Curate
        if: env.ANTHROPIC_API_KEY != '' && env.GIPHY_API_KEY != ''
        working-directory: agent
        env:
          CHARACTERS: ${{ inputs.characters }}
        run: |
          npm ci
          npx tsc -p .
          args=(--api "$AMII_API_URL" --limit "${{ inputs.limit || '10' }}" --target "${{ inputs.target || '12' }}")
          if [ -n "$CHARACTERS" ]; then args+=(--characters "$CHARACTERS"); fi
          node out/src/cli.js "${args[@]}" | tee curate.log
          { echo '```'; tail -n 40 curate.log; echo '```'; } > pr-body.md
      - name: Open pull request for review
        if: env.ANTHROPIC_API_KEY != '' && env.GIPHY_API_KEY != ''
        uses: peter-evans/create-pull-request@v7
        with:
          branch: giphy-manifest/update
          add-paths: api/manifests/giphy-characters.json
          commit-message: "Curate GIPHY character manifest"
          title: "Curated GIPHY GIFs for AMII characters"
          body-path: agent/pr-body.md
          labels: giphy-manifest
